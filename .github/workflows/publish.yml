name: Deploy and Release OBS Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Dotnet Publish
        run: |
          dotnet publish -c Release -o ./temp_publish

      - name: Merge DLLs via ILRepack
        run: |
          mkdir ./publish
          dotnet tool install -g dotnet-ilrepack
          
          ilrepack /out:./publish/YStreamUtils_OBSPlugin.dll \
                    /attr:./temp_publish/YStreamUtils_OBSPlugin.dll \
                    /internalize \
                    ./temp_publish/YStreamUtils_OBSPlugin.dll \
                    ./temp_publish/Microsoft.Extensions.Logging.Abstractions.dll \
                    ./temp_publish/obs-websocket-dotnet.dll \
                    ./temp_publish/YStreamUtils.SDK.dll

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} ./publish/YStreamUtils_OBSPlugin.dll \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for tag ${{ github.ref_name }}"
