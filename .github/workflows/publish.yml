name: Deploy and Release OBS Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Dotnet Publish
        run: |
          dotnet publish OBSPlugin.csproj -c Release -o ./temp_publish

      - name: Merge DLLs via ILRepack
          run: |
            mkdir ./publish
            dotnet tool install --global dotnet-ilrepack
            
            PLUGIN_DLL=OBSPlugin.dll
            DEPENDENCIES=$(find ./temp_publish -name "*.dll" ! -name "$PLUGIN_DLL")
            
            ilrepack /out:./publish/$PLUGIN_DLL \
                      /lib:./temp_publish \
                      /attr:./temp_publish/$PLUGIN_DLL \
                      /internalize \
                      ./temp_publish/$PLUGIN_DLL \
                      $DEPENDENCIES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} ./publish/OBSPlugin.dll \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for tag ${{ github.ref_name }}"
